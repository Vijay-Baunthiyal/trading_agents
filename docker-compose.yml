version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: autobot-postgres
    environment:
      POSTGRES_USER: autobot
      POSTGRES_PASSWORD: autobot_secret
      POSTGRES_DB: autobot_trading
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: autobot-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
